services:
  postgres:
    image: postgres:16-alpine
    container_name: ckscope-pg
    environment:
      POSTGRES_USER: ckscope
      POSTGRES_PASSWORD: ckscope
      POSTGRES_DB: ckscope
    ports:
      - "5432:5432"
    volumes:
      - ckscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckscope -d ckscope"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ckscope_pgdata:
